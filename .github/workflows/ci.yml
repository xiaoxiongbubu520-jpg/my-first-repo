name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sanity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Check README exists
        run: test -f README.md

      - name: Force failure demo
        run: exit 1
